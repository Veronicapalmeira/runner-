name: CI/CD Runner

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  static-analysis:
    name: Verificação estática
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: projetos/assinatura-go/go.mod

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go,java
          build-mode: manual

      - name: Compilar código para análise do CodeQL
        run: |
          cd projetos/assinatura-go
          go build -o assinatura .

          cd ../simulador-go
          go build -o simulador .

          cd ../assinador-java
          ./mvnw -B package -DskipTests

      - name: Analisar código com CodeQL
        uses: github/codeql-action/analyze@v4


  test-and-build:
    name: Testes e build
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: projetos/assinatura-go/go.mod

      - name: Testar assinatura
        working-directory: projetos/assinatura-go
        run: go test ./...

      - name: Testar simulador
        working-directory: projetos/simulador-go
        run: go test ./...

      - name: Compilar assinatura
        working-directory: projetos/assinatura-go
        run: go build -o assinatura .

      - name: Compilar simulador
        working-directory: projetos/simulador-go
        run: go build -o simulador .

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testar e empacotar assinador
        working-directory: projetos/assinador-java
        run: ./mvnw -B package

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: runner-application
          path: |
            projetos/assinatura-go/assinatura
            projetos/simulador-go/simulador
            projetos/assinador-java/target/assinador.jar


  staging:
    name: Ambiente Staging
    runs-on: ubuntu-latest
    needs: test-and-build
    environment:
      name: staging

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v5
        with:
          name: runner-application
          path: application

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Iniciar aplicação
        working-directory: application/assinador-java/target
        run: |
          java -jar assinador.jar --modo=servidor --porta=8080 > server.log 2>&1 &
          sleep 10

      - name: Verificar aplicação no Staging
        run: curl --fail http://localhost:8080/health


  dynamic-analysis:
    name: Verificação dinâmica
    runs-on: ubuntu-latest
    needs: staging

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Empacotar aplicação
        working-directory: projetos/assinador-java
        run: ./mvnw -B package -DskipTests

      - name: Iniciar aplicação
        working-directory: projetos/assinador-java
        run: |
          java -jar target/assinador.jar --modo=servidor --porta=8080 > server.log 2>&1 &
          sleep 10

      - name: Verificar endpoint da aplicação
        run: curl --fail http://localhost:8080/health

      - name: Executar OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false


  production:
    name: Ambiente Production
    runs-on: ubuntu-latest
    needs: dynamic-analysis
    environment:
      name: production

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v5
        with:
          name: runner-application
          path: application

      - name: Preparar aplicação para produção
        run: |
          echo "Aplicação aprovada para produção."
          ls -R application
